<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffe1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="退休进度" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>存款进度</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell dashboard-shell">
      <section class="summary-band dashboard-board">
        <div class="topbar"><div><h1>我的退休进度</h1></div></div>
        <div class="hero-metrics"><article class="hero-metric-card"><span>存款</span><strong id="depositTotal">¥0</strong></article><article class="hero-metric-card"><span>离退休还有</span><strong id="retirementDaysCard">待设置</strong></article></div>
        <div class="progress-line"><div class="deposit-progress"><div id="depositProgress" class="deposit-progress-fill"></div><img id="depositProgressMarker" class="deposit-progress-marker" src="assets/progress-mascot.png" alt="" aria-hidden="true" /></div><strong id="depositPercent" class="progress-percent">0%</strong></div>
        <div class="deposit-stats"><div><span>目标</span><strong id="targetLabel">¥0.00</strong></div><div><span>还差</span><strong id="depositGap">¥0.00</strong></div><div><span>较上次</span><strong id="depositDelta">暂无</strong></div></div>
        <div class="record-meta"><span id="currentRecordAt">本次记录：暂无</span><span id="previousRecordAt">上次更新：暂无</span></div>
        <form id="planningForm" class="planning-form"><label>目标金额<input id="targetAmount" name="targetAmount" type="number" min="0" step="100" inputmode="decimal" /></label><label>退休日期<input id="retirementDate" name="retirementDate" type="date" /></label><button type="submit">保存</button></form>
        <div class="primary-actions"><label class="upload-button" for="screenshotUpload">上传截图更新存款</label><input id="screenshotUpload" type="file" accept="image/*" multiple hidden /><small id="uploadHint">可一次选择多张截图。识别后请确认金额和账户，再更新存款。</small></div>
      </section>
      <section id="reviewSection" class="content-band review-section" hidden><div class="section-header"><h2>识别结果</h2><button id="clearReviews" class="secondary-button" type="button">清空</button></div><div id="reviewList" class="review-list"></div><button id="confirmReviews" class="confirm-button" type="button">确认更新存款</button></section>
      <section class="content-band accounts-band"><div class="section-header accounts-heading"><h2>账户明细</h2><button id="addAccount" class="secondary-button" type="button">添加账户</button></div><details class="accounts-panel"><summary>展开账户</summary><div id="accountList" class="account-list"></div></details></section>
    </main>
    <dialog id="accountDialog"><form id="accountForm" method="dialog" class="dialog-form"><h2 id="accountDialogTitle">添加账户</h2><input name="id" type="hidden" /><label>名称<input name="name" required maxlength="24" placeholder="例如 招商银行" /></label><label>类型<select name="type"><option value="securities">证券</option><option value="alipay">支付宝</option><option value="bank">银行</option><option value="cash">现金</option><option value="other">其他</option></select></label><label>统计口径<select name="scope"><option value="cash">现金余额</option><option value="total">总资产</option><option value="invested">投资资产</option></select></label><label>直接App链接<input name="directAppUrl" placeholder="例如 alipays://" /></label><label>快捷指令链接<input name="shortcutUrl" placeholder="例如 shortcuts://run-shortcut?name=打开中信证券" /></label><div class="dialog-actions"><button value="cancel" type="button" id="cancelDialog" class="secondary-button">取消</button><button value="default" type="submit">保存</button></div></form></dialog>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="app-mixed-launch.js?v=2" type="module"></script>
  </body>
</html>
